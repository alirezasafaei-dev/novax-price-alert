name = "novax-telegram-relay"
main = "src/index.js"
compatibility_date = "2026-05-31"
workers_dev = true

[observability]
enabled = true

[triggers]
crons = ["* * * * *"]

[vars]
REQUIRE_D1 = "true"
TELEGRAM_AUTH_MAX_AGE_SECONDS = "3600"

[[d1_databases]]
binding = "DB"
database_name = "novax-product"
database_id = "b8cfb687-e321-4ef1-999e-169d1f78026c"

[[kv_namespaces]]
binding = "ASSETS_KV"
id = "33333333333333333333333333333333" # replace with novax-miniapp-assets KV namespace id

[[kv_namespaces]]
binding = "ALERTS_KV"
id = "9bfa7672e25d446aa0a24165cbd1848a" # legacy/local fallback only; production alerts use D1

[[kv_namespaces]]
binding = "SESSIONS_KV"
id = "11111111111111111111111111111111" # replace with novax-sessions KV namespace id

[[kv_namespaces]]
binding = "USERS_KV"
id = "22222222222222222222222222222222" # replace with novax-users-cache KV namespace id

# متریک‌های پایه (T-403) روی Workers Analytics Engine.
# کوئری با SQL API: SELECT blob1 AS metric, SUM(double1) FROM novax_bot_metrics GROUP BY metric
[[analytics_engine_datasets]]
binding = "METRICS"
dataset = "novax_bot_metrics"

# هشدار عملیاتی (T-405): chat id مقصد هشدارها به‌صورت سکرت تنظیم می‌شود (در repo ذخیره نمی‌شود):
#   npx wrangler secret put OPS_CHAT_ID
# اگر تنظیم نشود، کد هشدار به‌صورت بی‌خطر no-op می‌ماند.
