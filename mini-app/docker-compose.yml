version: '3.8'

services:
  mini-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3012:3012"
    environment:
      - NODE_ENV=production
      - NOVAX_MINI_PORT=3012
      - NOVAX_API_BASE=http://host.docker.internal:8001
    restart: unless-stopped
    networks:
      - novax-network

networks:
  novax-network:
    driver: bridge
